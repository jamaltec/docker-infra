#######################
# 🍿 SEERR COMPOSE 🍿 #
#######################

## Pedidos de filmes/séries -> envia para Radarr/Sonarr
## Dentro da rede "media", use os nomes: http://jellyfin:8096,
## http://radarr:7878 e http://sonarr:8989
## O container roda como UID 1000 (usuário node da imagem)

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    restart: unless-stopped
    ports:
      - 5055:5055
    environment:
      TZ: America/Sao_Paulo
      LOG_LEVEL: info
    volumes:
      - /srv/docker/volumes/seerr/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      - media

networks:
  media:
    external: true
