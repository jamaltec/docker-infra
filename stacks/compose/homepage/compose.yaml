##########################
# 🏠 HOMEPAGE COMPOSE 🏠 #
##########################

## Painel com atalhos e estado de todos os serviços (pensado para o tablet)
## Acesso: http://IP-DO-SERVIDOR:3000
##
## Configuração (serviços, widgets, aparência): ./config, neste repositório
## Chaves de API e IP do servidor: /srv/docker/env_files/homepage.env (fora do git)
##   HOMEPAGE_ALLOWED_HOSTS=IP-DO-SERVIDOR:3000   <- obrigatório
##   HOMEPAGE_VAR_SERVER_IP=IP-DO-SERVIDOR
##   HOMEPAGE_VAR_JELLYFIN_KEY=...  (e as outras, ver config/services.yaml)

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - 3000:3000
    env_file:
      - path: /srv/docker/env_files/homepage.env
        required: false
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Sao_Paulo
      LOG_TARGETS: stdout # não grava logs dentro da pasta do repositório
    volumes:
      - /srv/docker/docker-infra/stacks/compose/homepage/config:/app/config
      - /srv/midia:/srv/midia:ro # só para mostrar o espaço livre do pool
    networks:
      - media # fala com jellyfin, radarr, sonarr... pelo nome
      - homepage-docker
    depends_on:
      - dockerproxy

  ## Dá ao Homepage acesso SÓ DE LEITURA à lista de containers.
  ## Mais seguro que montar o docker.sock direto no Homepage.
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: homepage-dockerproxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1 # liberar: listar containers e ver estado
      POST: 0 # bloquear: qualquer comando que altere algo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homepage-docker

networks:
  media:
    external: true
  homepage-docker:
