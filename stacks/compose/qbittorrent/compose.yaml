#############################
# 🧲 QBITTORRENT COMPOSE 🧲 #
#############################

## Downloads em /srv/midia/downloads, montado em /media (mesmo caminho do
## Sonarr/Radarr, então não precisa de "Remote Path Mapping")
## No qBittorrent: Default Save Path = /media/downloads
## Senha inicial da WebUI: docker logs qbittorrent

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - 8080:8080 # WebUI
      - 6881:6881 # porta do torrent
      - 6881:6881/udp
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Sao_Paulo
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - /srv/docker/volumes/qbittorrent/config:/config
      - /srv/midia:/media
    networks:
      - media

networks:
  media:
    external: true
