##########################
# 🎬 JELLYFIN COMPOSE 🎬 #
##########################

## Mídia: pool mergerfs em /srv/midia (montado só leitura em /media)
## Bibliotecas no Jellyfin: /media/Filmes, /media/Series, ...

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: 1000:1000
    restart: unless-stopped
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp # autodescoberta na rede local
    environment:
      TZ: America/Sao_Paulo
      ## Descomentar quando tiver proxy reverso
      # JELLYFIN_PublishedServerUrl: https://jellyfin.seudominio.com
    volumes:
      - /srv/docker/volumes/jellyfin/config:/config
      - /srv/docker/volumes/jellyfin/cache:/cache
      - type: bind
        source: /srv/midia
        target: /media
        read_only: false
    ## Aceleração por GPU (Intel/AMD): descomentar e trocar o GID
    ## pelo de `getent group render`
    # group_add:
    #   - "993"
    # devices:
    #   - /dev/dri:/dev/dri
