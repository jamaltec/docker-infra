########################
# 🎞️ RADARR COMPOSE 🎞️ #
########################

## Mídia: pool mergerfs em /srv/midia, montado em /media (mesmo caminho do Jellyfin)
## Pasta raiz no radarr: /media/filmes
## Rede "media" compartilhada com jellyfin/seerr (criar uma vez: docker network create media)

services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - 7878:7878
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Sao_Paulo
    volumes:
      - /srv/docker/volumes/radarr/config:/config
      - /srv/midia:/media
    networks:
      - media

networks:
  media:
    external: true
